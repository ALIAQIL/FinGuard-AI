name: FinGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m compileall -q src tests
      - run: pytest -q
      - run: ruff check src tests dags scripts

  real-data-benchmark:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -e . -r requirements.txt
      - name: Cache OpenML dataset
        uses: actions/cache@v4
        with:
          path: data/raw/creditcard.csv
          key: openml-creditcard-1597-v1
      - name: Download real ULB dataset if needed
        run: |
          mkdir -p data/raw
          python - <<'PY'
          from pathlib import Path
          from finguard.benchmark import _load_openml
          target = Path('data/raw/creditcard.csv')
          if not target.exists():
              _load_openml(target)
          print(target, target.stat().st_size)
          PY
      - run: >-
          python -m finguard.benchmark
          --input data/raw/creditcard.csv
          --output reports/benchmark_ulb.json
          --tune-xgboost
          --cv-splits 3
          --random-search-iterations 4
          --alert-rate 0.01
      - run: python -m finguard.phase1.eda --input data/raw/creditcard.csv --output reports/phase1 --master 'local[2]'
      - uses: actions/upload-artifact@v4
        with:
          name: finguard-benchmark
          path: |
            reports/benchmark_ulb.json
            reports/phase1/profile.json
            reports/phase1/numeric_summary.csv
